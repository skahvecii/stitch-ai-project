<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Arrows - Yön Oyunu</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0f0f1a;
    --card: #1a1a2e;
    --accent: #e94560;
    --accent2: #0f3460;
    --up: #4fc3f7;
    --down: #81c784;
    --left: #ffb74d;
    --right: #f06292;
    --white: #ffffff;
    --muted: #8892a4;
  }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--white);
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    user-select: none;
  }

  /* ─── SCREENS ─── */
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 24px;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .screen.hidden { opacity: 0; pointer-events: none; transform: scale(0.95); }

  /* ─── START SCREEN ─── */
  #startScreen {
    background: radial-gradient(ellipse at 50% 30%, #1a1a40 0%, #0f0f1a 70%);
  }

  .logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }

  .logo-arrows {
    display: flex;
    gap: 6px;
    font-size: 48px;
    animation: floatArrows 2s ease-in-out infinite;
  }

  @keyframes floatArrows {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .logo-title {
    font-size: 52px;
    font-weight: 900;
    letter-spacing: 6px;
    text-transform: uppercase;
    background: linear-gradient(135deg, #4fc3f7, #f06292, #ffb74d, #81c784);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .logo-subtitle {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .best-score-display {
    font-size: 15px;
    color: var(--muted);
    margin-top: 4px;
  }
  .best-score-display span { color: #ffd700; font-weight: 700; font-size: 18px; }

  .how-to-play {
    background: var(--card);
    border-radius: 16px;
    padding: 16px 24px;
    width: 100%;
    max-width: 340px;
    border: 1px solid rgba(255,255,255,0.07);
  }
  .how-to-play h3 { font-size: 12px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 12px; }
  .how-to-play-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 14px; }
  .how-arrow { font-size: 22px; width: 32px; text-align: center; }

  .mode-buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 340px;
  }

  .btn-start {
    padding: 16px 32px;
    border: none;
    border-radius: 50px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: transform 0.15s, box-shadow 0.15s;
    width: 100%;
  }
  .btn-start:active { transform: scale(0.96); }

  .btn-classic {
    background: linear-gradient(135deg, #e94560, #c2185b);
    color: white;
    box-shadow: 0 8px 32px rgba(233,69,96,0.4);
  }

  .btn-time {
    background: linear-gradient(135deg, #0f3460, #1565c0);
    color: white;
    box-shadow: 0 8px 32px rgba(15,52,96,0.5);
    border: 1px solid rgba(255,255,255,0.1);
  }

  /* ─── GAME SCREEN ─── */
  #gameScreen {
    background: var(--bg);
    justify-content: space-between;
    padding: 0;
  }

  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    padding: 16px 24px;
    padding-top: calc(16px + env(safe-area-inset-top));
    background: rgba(15,15,26,0.9);
    backdrop-filter: blur(10px);
  }

  .hud-block { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .hud-label { font-size: 10px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
  .hud-value { font-size: 28px; font-weight: 900; }

  #scoreDisplay { color: var(--white); }
  #comboDisplay { color: #ffd700; }
  #livesDisplay { font-size: 22px; letter-spacing: 2px; }

  .timer-bar-wrap {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
  }
  .timer-bar {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #4fc3f7, #e94560);
    transform-origin: left;
    transition: transform 0.05s linear;
  }

  .arena {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    width: 100%;
    overflow: hidden;
  }

  .big-arrow-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .arrow-ring {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: background 0.2s;
  }

  .arrow-ring::before {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: conic-gradient(var(--ring-color, #4fc3f7), transparent 60%, var(--ring-color, #4fc3f7));
    animation: spin 2s linear infinite;
    opacity: 0.6;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .big-arrow {
    font-size: 96px;
    line-height: 1;
    transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1);
    filter: drop-shadow(0 0 20px currentColor);
    position: relative;
    z-index: 1;
  }

  .big-arrow.animate-in {
    animation: arrowIn 0.25s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes arrowIn {
    0% { transform: scale(0) rotate(-180deg); opacity: 0; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .big-arrow.correct {
    animation: correctFlash 0.3s ease;
  }
  @keyframes correctFlash {
    0% { transform: scale(1); }
    40% { transform: scale(1.3); filter: brightness(2) drop-shadow(0 0 30px currentColor); }
    100% { transform: scale(1); }
  }

  .big-arrow.wrong {
    animation: wrongShake 0.4s ease;
  }
  @keyframes wrongShake {
    0%, 100% { transform: translateX(0) rotate(0); }
    20% { transform: translateX(-12px) rotate(-5deg); }
    40% { transform: translateX(12px) rotate(5deg); }
    60% { transform: translateX(-8px) rotate(-3deg); }
    80% { transform: translateX(8px) rotate(3deg); }
  }

  .score-popup {
    position: absolute;
    font-size: 28px;
    font-weight: 900;
    pointer-events: none;
    animation: floatUp 0.7s ease forwards;
    white-space: nowrap;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) scale(0.8); opacity: 1; }
    100% { transform: translateY(-80px) scale(1.1); opacity: 0; }
  }

  /* direction buttons */
  .controls {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    width: 100%;
    max-width: 380px;
    padding: 16px;
    gap: 10px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
  }

  .dir-btn {
    background: var(--card);
    border: 2px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    font-size: 36px;
    height: 80px;
    cursor: pointer;
    transition: transform 0.1s, background 0.1s, border-color 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .dir-btn:active { transform: scale(0.9); }
  .dir-btn.pressed { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); }

  #btnUp    { grid-column: 2; grid-row: 1; color: var(--up);    border-color: rgba(79,195,247,0.3); }
  #btnDown  { grid-column: 2; grid-row: 3; color: var(--down);  border-color: rgba(129,199,132,0.3); }
  #btnLeft  { grid-column: 1; grid-row: 2; color: var(--left);  border-color: rgba(255,183,77,0.3); }
  #btnRight { grid-column: 3; grid-row: 2; color: var(--right); border-color: rgba(240,98,146,0.3); }

  #btnUp:active    { background: rgba(79,195,247,0.25);  }
  #btnDown:active  { background: rgba(129,199,132,0.25); }
  #btnLeft:active  { background: rgba(255,183,77,0.25);  }
  #btnRight:active { background: rgba(240,98,146,0.25);  }

  .pause-btn {
    grid-column: 2; grid-row: 2;
    background: transparent;
    border: 2px solid rgba(255,255,255,0.06);
    border-radius: 20px;
    font-size: 20px;
    height: 80px;
    cursor: pointer;
    color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .pause-btn:active { background: rgba(255,255,255,0.08); }

  /* ─── PAUSE SCREEN ─── */
  #pauseScreen {
    background: rgba(15,15,26,0.95);
    backdrop-filter: blur(20px);
    z-index: 10;
  }
  .pause-title { font-size: 36px; font-weight: 900; letter-spacing: 4px; color: var(--muted); }

  /* ─── GAME OVER SCREEN ─── */
  #gameOverScreen {
    background: radial-gradient(ellipse at 50% 40%, #1a0a18 0%, #0f0f1a 70%);
    z-index: 10;
  }

  .go-title {
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 4px;
    color: var(--accent);
    text-transform: uppercase;
    text-shadow: 0 0 30px rgba(233,69,96,0.6);
  }

  .go-score-card {
    background: var(--card);
    border-radius: 24px;
    padding: 28px 48px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.07);
    width: 100%;
    max-width: 340px;
  }
  .go-score-label { font-size: 12px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
  .go-score-value { font-size: 64px; font-weight: 900; line-height: 1; }
  .go-divider { height: 1px; background: rgba(255,255,255,0.07); margin: 16px 0; }
  .go-stats { display: flex; justify-content: space-around; }
  .go-stat { text-align: center; }
  .go-stat-label { font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .go-stat-value { font-size: 22px; font-weight: 700; margin-top: 2px; }

  .new-best { color: #ffd700; font-size: 14px; font-weight: 700; letter-spacing: 2px; margin-top: 8px; animation: pulse 1s ease infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

  .go-buttons { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 340px; }

  .btn-retry {
    padding: 16px;
    border: none;
    border-radius: 50px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: linear-gradient(135deg, #e94560, #c2185b);
    color: white;
    box-shadow: 0 8px 32px rgba(233,69,96,0.4);
    transition: transform 0.15s;
  }
  .btn-retry:active { transform: scale(0.96); }

  .btn-home {
    padding: 14px;
    border: 2px solid rgba(255,255,255,0.12);
    border-radius: 50px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: transparent;
    color: var(--muted);
    transition: transform 0.15s, border-color 0.15s;
  }
  .btn-home:active { transform: scale(0.96); border-color: rgba(255,255,255,0.3); }

  /* ─── DIFFICULTY BADGE ─── */
  .difficulty-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 3px 8px;
    border-radius: 20px;
    text-transform: uppercase;
  }

  /* ─── LEVEL FLASH ─── */
  .level-flash {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }
  .level-flash.show {
    animation: levelFlash 1.2s ease forwards;
  }
  @keyframes levelFlash {
    0% { opacity: 0; }
    20% { opacity: 1; }
    80% { opacity: 1; }
    100% { opacity: 0; }
  }
  .level-text {
    font-size: 36px;
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
    text-shadow: 0 0 30px currentColor;
    padding: 16px 32px;
    border-radius: 16px;
    background: rgba(15,15,26,0.8);
  }

  /* swipe zone overlay */
  #swipeZone {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: none;
  }
  #swipeZone.active { display: block; }
</style>
</head>
<body>

<!-- ═══ START SCREEN ═══ -->
<div class="screen" id="startScreen">
  <div class="logo">
    <div class="logo-arrows">⬆️⬇️⬅️➡️</div>
    <div class="logo-title">ARROWS</div>
    <div class="logo-subtitle">Yön Oyunu</div>
  </div>

  <div class="best-score-display">En İyi Skor: <span id="bestScoreStart">0</span></div>

  <div class="how-to-play">
    <h3>Nasıl Oynanır?</h3>
    <div class="how-to-play-row"><span class="how-arrow" style="color:var(--up)">↑</span> Okun gösterdiği yöne bas</div>
    <div class="how-to-play-row"><span class="how-arrow" style="color:#ffd700">🔥</span> Seri yapınca puan çarpar</div>
    <div class="how-to-play-row"><span class="how-arrow" style="color:var(--accent)">❤️</span> 3 can — yanlış veya süre!</div>
    <div class="how-to-play-row"><span class="how-arrow" style="color:#a5d6a7">⚡</span> Hız giderek artar!</div>
  </div>

  <div class="mode-buttons">
    <button class="btn-start btn-classic" onclick="startGame('classic')">🎮 Klasik Mod</button>
    <button class="btn-start btn-time" onclick="startGame('timed')">⏱ Zaman Baskısı</button>
  </div>
</div>

<!-- ═══ GAME SCREEN ═══ -->
<div class="screen hidden" id="gameScreen">
  <div class="hud">
    <div class="hud-block">
      <div class="hud-label">Puan</div>
      <div class="hud-value" id="scoreDisplay">0</div>
    </div>
    <div class="hud-block">
      <div class="hud-label">Can</div>
      <div class="hud-value" id="livesDisplay">❤️❤️❤️</div>
    </div>
    <div class="hud-block">
      <div class="hud-label">Seri</div>
      <div class="hud-value" id="comboDisplay">x1</div>
    </div>
  </div>

  <div class="timer-bar-wrap">
    <div class="timer-bar" id="timerBar"></div>
  </div>

  <div class="arena" id="arena">
    <div id="swipeZone"></div>
    <div class="big-arrow-wrap">
      <div class="arrow-ring" id="arrowRing">
        <div class="big-arrow" id="bigArrow">↑</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="dir-btn" id="btnUp"    onclick="handleInput('up')">↑</button>
    <button class="dir-btn" id="btnDown"  onclick="handleInput('down')">↓</button>
    <button class="dir-btn" id="btnLeft"  onclick="handleInput('left')">←</button>
    <button class="dir-btn" id="btnRight" onclick="handleInput('right')">→</button>
    <button class="pause-btn" onclick="togglePause()">⏸</button>
  </div>
</div>

<!-- ═══ PAUSE SCREEN ═══ -->
<div class="screen hidden" id="pauseScreen">
  <div class="pause-title">DURAKLADI</div>
  <div style="color:var(--muted); font-size:15px;">Şu anki skor: <span id="pauseScore" style="color:white;font-weight:700;">0</span></div>
  <div style="display:flex;flex-direction:column;gap:12px;width:100%;max-width:280px;margin-top:12px;">
    <button class="btn-retry" onclick="togglePause()">▶ Devam Et</button>
    <button class="btn-home" onclick="goHome()">⌂ Ana Menü</button>
  </div>
</div>

<!-- ═══ GAME OVER SCREEN ═══ -->
<div class="screen hidden" id="gameOverScreen">
  <div class="go-title">BİTTİ!</div>

  <div class="go-score-card">
    <div class="go-score-label">Puanın</div>
    <div class="go-score-value" id="goScore" style="color:var(--up)">0</div>
    <div id="newBestBadge" class="new-best hidden">🏆 YENİ REKOR!</div>
    <div class="go-divider"></div>
    <div class="go-stats">
      <div class="go-stat">
        <div class="go-stat-label">En İyi</div>
        <div class="go-stat-value" id="goBest" style="color:#ffd700">0</div>
      </div>
      <div class="go-stat">
        <div class="go-stat-label">Seviye</div>
        <div class="go-stat-value" id="goLevel" style="color:var(--accent)">1</div>
      </div>
      <div class="go-stat">
        <div class="go-stat-label">Max Seri</div>
        <div class="go-stat-value" id="goCombo" style="color:#ffd700">x1</div>
      </div>
    </div>
  </div>

  <div class="go-buttons">
    <button class="btn-retry" id="retryBtn">↺ Tekrar Oyna</button>
    <button class="btn-home" onclick="goHome()">⌂ Ana Menü</button>
  </div>
</div>

<!-- level flash overlay -->
<div class="level-flash" id="levelFlash">
  <div class="level-text" id="levelFlashText">SEVİYE 2</div>
</div>

<script>
// ══════════════════════════════════════════
//  ARROWS GAME ENGINE
// ══════════════════════════════════════════

const DIRS = ['up', 'down', 'left', 'right'];
const ARROW_CHARS = { up: '↑', down: '↓', left: '←', right: '→' };
const ARROW_COLORS = { up: '#4fc3f7', down: '#81c784', left: '#ffb74d', right: '#f06292' };
const RING_COLORS  = { up: '#4fc3f7', down: '#81c784', left: '#ffb74d', right: '#f06292' };

// Levels: { speed (ms per arrow), label }
const LEVELS = [
  { minScore: 0,   timeLimit: 3000, label: 'KOLAY' },
  { minScore: 5,   timeLimit: 2500, label: 'NORMAL' },
  { minScore: 15,  timeLimit: 2000, label: 'HIZLI' },
  { minScore: 30,  timeLimit: 1600, label: 'ÇOK HIZLI' },
  { minScore: 50,  timeLimit: 1300, label: 'ÇIĞLIK' },
  { minScore: 75,  timeLimit: 1050, label: 'UÇUYOR!' },
  { minScore: 100, timeLimit: 850,  label: 'İMKANSIZ' },
];

let state = {
  running: false,
  paused: false,
  mode: 'classic',
  score: 0,
  lives: 3,
  combo: 1,
  maxCombo: 1,
  level: 0,
  currentDir: null,
  timerStart: 0,
  timerDuration: 3000,
  animFrame: null,
  canInput: false,
  bestScore: 0,
};

// ── Audio (Web Audio API) ──
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playTone(freq, dur, type = 'sine', gain = 0.3) {
  try {
    const ac = getAudio();
    const osc = ac.createOscillator();
    const gainNode = ac.createGain();
    osc.connect(gainNode); gainNode.connect(ac.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ac.currentTime);
    gainNode.gain.setValueAtTime(gain, ac.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    osc.start(ac.currentTime);
    osc.stop(ac.currentTime + dur);
  } catch(e) {}
}
function sfxCorrect(combo) {
  const base = 440 + (combo - 1) * 60;
  playTone(base, 0.12, 'square', 0.25);
  setTimeout(() => playTone(base * 1.5, 0.1, 'square', 0.15), 80);
}
function sfxWrong() {
  playTone(180, 0.25, 'sawtooth', 0.3);
}
function sfxLevelUp() {
  [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => playTone(f, 0.15, 'square', 0.2), i * 100));
}
function sfxTick() {
  playTone(880, 0.05, 'sine', 0.1);
}

// ── Storage ──
function loadBest() {
  state.bestScore = parseInt(localStorage.getItem('arrows_best') || '0');
  document.getElementById('bestScoreStart').textContent = state.bestScore;
}
function saveBest(s) {
  if (s > state.bestScore) {
    state.bestScore = s;
    localStorage.setItem('arrows_best', s);
    return true;
  }
  return false;
}

// ── DOM refs ──
const screens = {
  start: document.getElementById('startScreen'),
  game: document.getElementById('gameScreen'),
  pause: document.getElementById('pauseScreen'),
  over: document.getElementById('gameOverScreen'),
};
const bigArrow   = document.getElementById('bigArrow');
const arrowRing  = document.getElementById('arrowRing');
const timerBar   = document.getElementById('timerBar');
const scoreEl    = document.getElementById('scoreDisplay');
const comboEl    = document.getElementById('comboDisplay');
const livesEl    = document.getElementById('livesDisplay');
const arena      = document.getElementById('arena');
const levelFlash = document.getElementById('levelFlash');

function showScreen(name) {
  Object.entries(screens).forEach(([k, el]) => {
    el.classList.toggle('hidden', k !== name);
  });
}

// ── Game Init ──
function startGame(mode) {
  state.mode = mode;
  state.score = 0;
  state.lives = 3;
  state.combo = 1;
  state.maxCombo = 1;
  state.level = 0;
  state.running = true;
  state.paused = false;
  state.canInput = false;

  updateHUD();
  showScreen('game');
  setupSwipe();
  nextArrow();
}

function getTimeLimit() {
  const lvl = LEVELS[state.level];
  // timed mode is 20% faster
  return state.mode === 'timed' ? Math.round(lvl.timeLimit * 0.8) : lvl.timeLimit;
}

function nextArrow() {
  if (!state.running) return;
  const dir = DIRS[Math.floor(Math.random() * 4)];
  state.currentDir = dir;
  state.timerDuration = getTimeLimit();
  state.timerStart = performance.now();
  state.canInput = true;

  // update arrow visuals
  bigArrow.textContent = ARROW_CHARS[dir];
  bigArrow.style.color = ARROW_COLORS[dir];
  arrowRing.style.setProperty('--ring-color', RING_COLORS[dir]);
  arrowRing.style.background = `radial-gradient(circle, rgba(${hexToRgb(ARROW_COLORS[dir])},0.12) 0%, transparent 70%)`;

  bigArrow.classList.remove('animate-in', 'correct', 'wrong');
  void bigArrow.offsetWidth; // reflow
  bigArrow.classList.add('animate-in');

  cancelAnimationFrame(state.animFrame);
  tickTimer();
}

function tickTimer() {
  if (!state.running || state.paused) return;
  const elapsed = performance.now() - state.timerStart;
  const progress = Math.max(0, 1 - elapsed / state.timerDuration);

  timerBar.style.transform = `scaleX(${progress})`;

  // warning color
  if (progress < 0.25) {
    timerBar.style.background = 'linear-gradient(90deg, #e94560, #ff1744)';
    if (progress < 0.15 && Math.floor(elapsed / 300) !== Math.floor((elapsed - 16) / 300)) {
      sfxTick();
    }
  } else if (progress < 0.5) {
    timerBar.style.background = 'linear-gradient(90deg, #ffb74d, #e94560)';
  } else {
    timerBar.style.background = 'linear-gradient(90deg, #4fc3f7, #e94560)';
  }

  if (progress <= 0) {
    timeOut();
    return;
  }
  state.animFrame = requestAnimationFrame(tickTimer);
}

function timeOut() {
  if (!state.canInput) return;
  state.canInput = false;
  sfxWrong();
  bigArrow.classList.add('wrong');
  loseLife();
  setTimeout(() => {
    if (state.running) nextArrow();
  }, 500);
}

function handleInput(dir) {
  if (!state.running || state.paused || !state.canInput) return;
  state.canInput = false;
  cancelAnimationFrame(state.animFrame);

  const btn = { up: 'btnUp', down: 'btnDown', left: 'btnLeft', right: 'btnRight' }[dir];
  const btnEl = document.getElementById(btn);
  btnEl.classList.add('pressed');
  setTimeout(() => btnEl.classList.remove('pressed'), 150);

  if (dir === state.currentDir) {
    // CORRECT
    const elapsed = performance.now() - state.timerStart;
    const speedBonus = Math.max(1, Math.round((state.timerDuration - elapsed) / state.timerDuration * 3));
    const points = state.combo * speedBonus;
    state.score += points;
    state.combo = Math.min(state.combo + 1, 12);
    if (state.combo > state.maxCombo) state.maxCombo = state.combo;

    sfxCorrect(state.combo);
    bigArrow.classList.add('correct');
    spawnPopup(`+${points}`, '#ffd700');
    checkLevelUp();
    updateHUD();

    setTimeout(() => { if (state.running) nextArrow(); }, 250);
  } else {
    // WRONG
    sfxWrong();
    state.combo = 1;
    bigArrow.classList.add('wrong');
    spawnPopup('✗', '#e94560');
    updateHUD();
    loseLife();
    setTimeout(() => { if (state.running) nextArrow(); }, 450);
  }
}

function loseLife() {
  state.lives--;
  updateHUD();
  flashScreen();
  if (state.lives <= 0) {
    setTimeout(gameOver, 300);
    state.running = false;
  }
}

function flashScreen() {
  document.body.style.background = '#3a0010';
  setTimeout(() => document.body.style.background = '', 200);
}

function checkLevelUp() {
  let newLevel = 0;
  for (let i = LEVELS.length - 1; i >= 0; i--) {
    if (state.score >= LEVELS[i].minScore) { newLevel = i; break; }
  }
  if (newLevel > state.level) {
    state.level = newLevel;
    sfxLevelUp();
    showLevelFlash(LEVELS[newLevel].label);
  }
}

function showLevelFlash(label) {
  const t = document.getElementById('levelFlashText');
  t.textContent = label + '!';
  t.style.color = ARROW_COLORS[DIRS[Math.floor(Math.random() * 4)]];
  levelFlash.classList.remove('show');
  void levelFlash.offsetWidth;
  levelFlash.classList.add('show');
}

function updateHUD() {
  scoreEl.textContent = state.score;
  comboEl.textContent = `x${state.combo}`;
  comboEl.style.color = state.combo >= 5 ? '#ffd700' : state.combo >= 3 ? '#ffb74d' : 'var(--white)';
  const hearts = '❤️'.repeat(state.lives) + '🖤'.repeat(Math.max(0, 3 - state.lives));
  livesEl.textContent = hearts;
}

function spawnPopup(text, color) {
  const el = document.createElement('div');
  el.className = 'score-popup';
  el.textContent = text;
  el.style.color = color;
  el.style.left = '50%';
  el.style.top = '50%';
  el.style.transform = 'translate(-50%, -50%)';
  arena.appendChild(el);
  setTimeout(() => el.remove(), 700);
}

// ── PAUSE ──
function togglePause() {
  if (!state.running) return;
  state.paused = !state.paused;
  if (state.paused) {
    cancelAnimationFrame(state.animFrame);
    document.getElementById('pauseScore').textContent = state.score;
    showScreen('pause');
  } else {
    showScreen('game');
    state.timerStart = performance.now() - (state.timerDuration * (1 - parseFloat(timerBar.style.transform?.replace('scaleX(', '') || 1)));
    tickTimer();
  }
}

// ── GAME OVER ──
function gameOver() {
  cancelAnimationFrame(state.animFrame);
  const isNew = saveBest(state.score);

  document.getElementById('goScore').textContent = state.score;
  document.getElementById('goBest').textContent = state.bestScore;
  document.getElementById('goLevel').textContent = state.level + 1;
  document.getElementById('goCombo').textContent = `x${state.maxCombo}`;
  document.getElementById('goScore').style.color = ARROW_COLORS[DIRS[Math.floor(Math.random() * 4)]];

  const badge = document.getElementById('newBestBadge');
  badge.classList.toggle('hidden', !isNew);

  document.getElementById('retryBtn').onclick = () => startGame(state.mode);
  document.getElementById('bestScoreStart').textContent = state.bestScore;

  showScreen('over');
}

function goHome() {
  state.running = false;
  state.paused = false;
  cancelAnimationFrame(state.animFrame);
  loadBest();
  showScreen('start');
}

// ── SWIPE SUPPORT ──
function setupSwipe() {
  const zone = document.getElementById('swipeZone');
  zone.classList.add('active');
  let sx, sy;

  zone.addEventListener('touchstart', e => {
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
  }, { passive: true });

  zone.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < 30) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      handleInput(dx > 0 ? 'right' : 'left');
    } else {
      handleInput(dy > 0 ? 'down' : 'up');
    }
  }, { passive: true });
}

// ── KEYBOARD SUPPORT ──
document.addEventListener('keydown', e => {
  if (!state.running || state.paused) return;
  const map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right' };
  if (map[e.key]) {
    e.preventDefault();
    handleInput(map[e.key]);
  }
  if (e.key === 'Escape' || e.key === 'p') togglePause();
});

// ── UTILS ──
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}

// ── INIT ──
loadBest();
showScreen('start');
</script>
</body>
