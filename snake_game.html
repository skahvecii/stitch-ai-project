<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snake — Modern Yılan</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; height:100dvh; background:#080812; color:#fff; font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; user-select:none; touch-action:none; }
body { display:flex; flex-direction:column; }

/* ── OVERLAY SCREENS ── */
.screen { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:28px; z-index:100; transition:opacity .25s; }
.screen.hidden { opacity:0; pointer-events:none; }

#startScreen { background:radial-gradient(ellipse at 50% 35%, #0a1f12 0%, #080812 75%); }

.snake-logo { display:flex; gap:4px; font-size:42px; animation:logoFloat 2.5s ease-in-out infinite; }
@keyframes logoFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
.game-title { font-size:54px; font-weight:900; letter-spacing:6px; text-transform:uppercase;
  background:linear-gradient(135deg,#00ff88,#00ccff,#ff44ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.game-sub { font-size:12px; letter-spacing:4px; color:#4a5568; text-transform:uppercase; }

.best-line { font-size:14px; color:#4a5568; }
.best-line span { color:#ffd700; font-weight:700; font-size:17px; }

.food-legend { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.06); border-radius:16px; padding:14px 20px; width:100%; max-width:320px; }
.food-legend h4 { font-size:10px; letter-spacing:3px; color:#4a5568; text-transform:uppercase; margin-bottom:10px; }
.fl-row { display:flex; align-items:center; gap:10px; margin-bottom:6px; font-size:13px; color:#aaa; }
.fl-icon { font-size:20px; width:26px; text-align:center; }

.start-btns { display:flex; flex-direction:column; gap:10px; width:100%; max-width:320px; }
.btn-play { padding:15px; border:none; border-radius:50px; font-size:17px; font-weight:700; cursor:pointer; letter-spacing:2px; text-transform:uppercase; transition:transform .12s; }
.btn-play:active { transform:scale(.95); }
.btn-easy  { background:linear-gradient(135deg,#00cc66,#009944); color:#fff; box-shadow:0 6px 24px rgba(0,204,102,.4); }
.btn-hard  { background:linear-gradient(135deg,#cc2244,#991133); color:#fff; box-shadow:0 6px 24px rgba(204,34,68,.4); border:none; }

/* ── PAUSE / GAME OVER ── */
#pauseScreen { background:rgba(8,8,18,.92); backdrop-filter:blur(16px); }
#gameOverScreen { background:radial-gradient(ellipse at 50% 40%, #18010d 0%, #080812 70%); }

.overlay-title { font-size:38px; font-weight:900; letter-spacing:4px; text-transform:uppercase; }
#pauseScreen .overlay-title { color:#4a5568; }
#gameOverScreen .overlay-title { color:#ff4466; text-shadow:0 0 30px rgba(255,68,102,.5); }

.score-card { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.06); border-radius:22px; padding:24px 44px; text-align:center; width:100%; max-width:320px; }
.sc-label { font-size:11px; letter-spacing:3px; color:#4a5568; text-transform:uppercase; margin-bottom:4px; }
.sc-value { font-size:58px; font-weight:900; line-height:1.1; }
.sc-divider { height:1px; background:rgba(255,255,255,.06); margin:14px 0; }
.sc-stats { display:flex; justify-content:space-around; }
.sc-stat label { display:block; font-size:10px; color:#4a5568; letter-spacing:1px; text-transform:uppercase; }
.sc-stat span  { font-size:20px; font-weight:700; }
.new-best { color:#ffd700; font-size:13px; font-weight:700; letter-spacing:2px; margin-top:6px; animation:pulse 1s ease infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

.over-btns { display:flex; flex-direction:column; gap:10px; width:100%; max-width:320px; }
.btn-retry { padding:15px; border:none; border-radius:50px; font-size:17px; font-weight:700; cursor:pointer;
  letter-spacing:2px; text-transform:uppercase; background:linear-gradient(135deg,#00cc66,#009944); color:#fff;
  box-shadow:0 6px 24px rgba(0,204,102,.4); transition:transform .12s; }
.btn-retry:active { transform:scale(.95); }
.btn-menu { padding:13px; border:1px solid rgba(255,255,255,.1); border-radius:50px; font-size:14px; font-weight:600; cursor:pointer;
  letter-spacing:1px; text-transform:uppercase; background:transparent; color:#4a5568; transition:transform .12s; }
.btn-menu:active { transform:scale(.95); }

/* ── GAME LAYOUT ── */
#gameLayout { display:flex; flex-direction:column; width:100%; height:100%; }

#hud { display:flex; justify-content:space-between; align-items:center; padding:10px 20px; padding-top:calc(10px + env(safe-area-inset-top));
  background:rgba(8,8,18,.85); backdrop-filter:blur(8px); flex-shrink:0; }
.hud-block { display:flex; flex-direction:column; align-items:center; gap:1px; }
.hud-lbl { font-size:9px; letter-spacing:3px; color:#2d3748; text-transform:uppercase; }
.hud-val { font-size:26px; font-weight:900; }
#hudScore { color:#fff; }
#hudLevel { color:#00ff88; }
#hudBest  { color:#ffd700; }

#canvasWrap { flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; }
canvas { display:block; border-radius:12px; }

#controlArea { display:flex; align-items:center; justify-content:space-between; padding:0 24px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom)); flex-shrink:0; background:rgba(8,8,18,.85); }

/* Active effects */
#effects { display:flex; flex-direction:column; gap:6px; min-width:80px; }
.effect-chip { display:flex; align-items:center; gap:5px; background:rgba(255,255,255,.06); border-radius:20px;
  padding:4px 10px; font-size:12px; font-weight:600; white-space:nowrap; }
.effect-chip .ef-bar { width:40px; height:3px; background:rgba(255,255,255,.15); border-radius:2px; overflow:hidden; }
.effect-chip .ef-fill { height:100%; border-radius:2px; transition:width .1s linear; }

/* Joystick */
#joystickArea { display:flex; align-items:center; justify-content:center; position:relative; }
#jBase { width:130px; height:130px; border-radius:50%; background:rgba(255,255,255,.04); border:2px solid rgba(255,255,255,.08); position:relative; display:flex; align-items:center; justify-content:center; }
#jThumb { width:54px; height:54px; border-radius:50%; background:rgba(255,255,255,.14); border:2px solid rgba(255,255,255,.22); position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); transition:transform .05s; box-shadow:0 0 16px rgba(0,255,136,.2); }
.j-hint { position:absolute; font-size:14px; color:rgba(255,255,255,.18); pointer-events:none; }
.j-hint-up    { top:8px;    left:50%; transform:translateX(-50%); }
.j-hint-down  { bottom:8px; left:50%; transform:translateX(-50%); }
.j-hint-left  { left:8px;   top:50%; transform:translateY(-50%); }
.j-hint-right { right:8px;  top:50%; transform:translateY(-50%); }

/* Pause btn */
#pauseBtn { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); border-radius:16px;
  font-size:18px; padding:12px 14px; cursor:pointer; color:#4a5568; transition:background .15s; min-width:80px; text-align:center; }
#pauseBtn:active { background:rgba(255,255,255,.1); }

/* Level flash */
#lvlFlash { position:fixed; inset:0; pointer-events:none; z-index:50; display:flex; align-items:center; justify-content:center; opacity:0; }
#lvlFlash.show { animation:lflash 1.3s ease forwards; }
@keyframes lflash { 0%{opacity:0} 15%{opacity:1} 75%{opacity:1} 100%{opacity:0} }
#lvlText { font-size:32px; font-weight:900; letter-spacing:4px; text-transform:uppercase; padding:14px 30px;
  border-radius:14px; background:rgba(8,8,18,.85); backdrop-filter:blur(10px); text-shadow:0 0 20px currentColor; }
</style>
</head>
<body>

<!-- ═══ START ═══ -->
<div class="screen" id="startScreen">
  <div class="snake-logo">🐍</div>
  <div class="game-title">SNAKE</div>
  <div class="game-sub">Modern Yılan Oyunu</div>
  <div class="best-line">En İyi Skor: <span id="bestStart">0</span></div>
  <div class="food-legend">
    <h4>Özel Yemler</h4>
    <div class="fl-row"><span class="fl-icon">⭐</span> Altın Yıldız — +3 uzunluk, +50 puan</div>
    <div class="fl-row"><span class="fl-icon">💎</span> Elmas — 2x puan modu (10sn)</div>
    <div class="fl-row"><span class="fl-icon">⚡</span> Şimşek — Hız artışı (6sn)</div>
    <div class="fl-row"><span class="fl-icon">💊</span> Hap — Kısalır ama +40 puan!</div>
  </div>
  <div class="start-btns">
    <button class="btn-play btn-easy" onclick="startGame(150)">🎮 Normal Mod</button>
    <button class="btn-play btn-hard" onclick="startGame(100)">🔥 Hızlı Mod</button>
  </div>
</div>

<!-- ═══ PAUSE ═══ -->
<div class="screen hidden" id="pauseScreen">
  <div class="overlay-title">DURAKLADI</div>
  <div style="color:#4a5568;font-size:14px">Skor: <span id="pauseScoreVal" style="color:#fff;font-weight:700">0</span></div>
  <div style="display:flex;flex-direction:column;gap:10px;width:100%;max-width:280px;margin-top:8px">
    <button class="btn-retry" onclick="resumeGame()">▶ Devam Et</button>
    <button class="btn-menu"  onclick="goHome()">⌂ Ana Menü</button>
  </div>
</div>

<!-- ═══ GAME OVER ═══ -->
<div class="screen hidden" id="gameOverScreen">
  <div class="overlay-title">ÖLDÜN!</div>
  <div class="score-card">
    <div class="sc-label">Puan</div>
    <div class="sc-value" id="goScore">0</div>
    <div id="newBest" class="new-best hidden">🏆 YENİ REKOR!</div>
    <div class="sc-divider"></div>
    <div class="sc-stats">
      <div class="sc-stat"><label>En İyi</label><span id="goBest" style="color:#ffd700">0</span></div>
      <div class="sc-stat"><label>Seviye</label><span id="goLevel" style="color:#00ff88">1</span></div>
      <div class="sc-stat"><label>Uzunluk</label><span id="goLen" style="color:#00ccff">3</span></div>
    </div>
  </div>
  <div class="over-btns">
    <button class="btn-retry" id="retryBtn">↺ Tekrar Oyna</button>
    <button class="btn-menu"  onclick="goHome()">⌂ Ana Menü</button>
  </div>
</div>

<!-- ═══ GAME ═══ -->
<div id="gameLayout" style="display:none">
  <div id="hud">
    <div class="hud-block"><div class="hud-lbl">Puan</div><div class="hud-val" id="hudScore">0</div></div>
    <div class="hud-block"><div class="hud-lbl">Seviye</div><div class="hud-val" id="hudLevel">1</div></div>
    <div class="hud-block"><div class="hud-lbl">En İyi</div><div class="hud-val" id="hudBest">0</div></div>
  </div>
  <div id="canvasWrap"><canvas id="gc"></canvas></div>
  <div id="controlArea" style="height:160px">
    <div id="effects"></div>
    <div id="joystickArea">
      <div id="jBase">
        <span class="j-hint j-hint-up">▲</span>
        <span class="j-hint j-hint-down">▼</span>
        <span class="j-hint j-hint-left">◀</span>
        <span class="j-hint j-hint-right">▶</span>
        <div id="jThumb"></div>
      </div>
    </div>
    <button id="pauseBtn" onclick="togglePause()">⏸<br><span style="font-size:9px;letter-spacing:1px">DURAKLAT</span></button>
  </div>
</div>

<div id="lvlFlash"><div id="lvlText">SEVİYE 2</div></div>

<script>
// ══════════════════════════════════
//  CONSTANTS
// ══════════════════════════════════
const CELL = 19;
const FOOD_TYPES = {
  apple:   { emoji:'🍎', color:'#ff4455', pts:10, grow:1,  duration:null,  special:false },
  star:    { emoji:'⭐', color:'#ffd700', pts:50, grow:3,  duration:8000,  special:true  },
  diamond: { emoji:'💎', color:'#00ccff', pts:30, grow:0,  duration:6500,  special:true, effect:'double'  },
  bolt:    { emoji:'⚡', color:'#ffaa00', pts:20, grow:1,  duration:7000,  special:true, effect:'speed'   },
  pill:    { emoji:'💊', color:'#ff44cc', pts:40, grow:-3, duration:8000,  special:true  },
};
const LEVEL_SPEEDS = [150,135,120,108,96,86,76,68,60,54]; // ms/step per level
const SPECIAL_SPAWN_MIN = 18000;
const SPECIAL_SPAWN_MAX = 35000;

// ══════════════════════════════════
//  STATE
// ══════════════════════════════════
let G = {}; // game state
let canvas, ctx, cellW, cellH, bgImg;
let rafId, lastTs, lastMove;
let bestScore = parseInt(localStorage.getItem('snake_best')||'0');

// ══════════════════════════════════
//  AUDIO
// ══════════════════════════════════
let ac;
const getAC = () => { if (!ac) ac = new (window.AudioContext||window.webkitAudioContext)(); return ac; };
function tone(freq, dur, type='sine', vol=0.2) {
  try {
    const a=getAC(), o=a.createOscillator(), g=a.createGain();
    o.connect(g); g.connect(a.destination);
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);
    o.start(); o.stop(a.currentTime+dur);
  } catch(e){}
}
const sfxEat     = () => { tone(660,.08,'square',.18); setTimeout(()=>tone(880,.07,'square',.12),60); };
const sfxSpecial = () => [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.12,'square',.18),i*80));
const sfxDie     = () => { tone(220,.15,'sawtooth',.3); setTimeout(()=>tone(150,.3,'sawtooth',.2),120); };
const sfxLevel   = () => [659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,.1,'square',.2),i*90));

// ══════════════════════════════════
//  CANVAS SETUP
// ══════════════════════════════════
function setupCanvas() {
  canvas = document.getElementById('gc');
  ctx = canvas.getContext('2d');
  const wrap = document.getElementById('canvasWrap');
  const maxW = Math.min(wrap.clientWidth - 8, 400);
  const maxH = Math.min(wrap.clientHeight - 8, 400);
  const size = Math.min(maxW, maxH);
  canvas.width = canvas.height = size;
  cellW = cellH = size / G.cols;
  buildBackground(size);
}

function buildBackground(size) {
  const oc = document.createElement('canvas');
  oc.width = oc.height = size;
  const ox = oc.getContext('2d');
  ox.fillStyle = '#0a0a16';
  ox.fillRect(0,0,size,size);
  // subtle dot grid
  ox.fillStyle = 'rgba(255,255,255,.025)';
  for (let x=0; x<G.cols; x++)
    for (let y=0; y<G.cols; y++) {
      ox.beginPath();
      ox.arc(x*cellW+cellW*.5, y*cellH+cellH*.5, 1, 0, Math.PI*2);
      ox.fill();
    }
  bgImg = oc;
}

// ══════════════════════════════════
//  GAME INIT
// ══════════════════════════════════
function startGame(baseSpeed) {
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameLayout').style.display = 'flex';

  const size = 360;
  G = {
    cols: Math.floor(size / CELL),
    baseSpeed,
    speed: baseSpeed,
    score: 0,
    level: 1,
    running: true,
    paused: false,
    dead: false,
    dir: 'right',
    nextDir: 'right',
    snake: [],           // [{x,y,px,py}]
    regularFood: null,
    specialFoods: [],    // [{x,y,type,timer,maxTimer}]
    particles: [],       // particle pool
    effects: {},         // active power-ups {name:{timer,maxTimer}}
    specialSpawnTimer: randomSpecialDelay(),
    doublePoints: false,
    speedBoost: false,
  };

  setupCanvas();

  // initial snake (length 3, center)
  // snake[0] = head (rightmost), moving right
  const cx = Math.floor(G.cols/2), cy = Math.floor(G.cols/2);
  for (let i=0; i<3; i++)
    G.snake.push({x:cx+1-i, y:cy, px:cx-i, py:cy});

  spawnRegular();
  updateHUD();

  lastTs = performance.now();
  lastMove = lastTs;
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}

function randomSpecialDelay() {
  return SPECIAL_SPAWN_MIN + Math.random()*(SPECIAL_SPAWN_MAX-SPECIAL_SPAWN_MIN);
}

// ══════════════════════════════════
//  GAME LOOP
// ══════════════════════════════════
function loop(ts) {
  if (!G.running) return;
  const dt = ts - lastTs;
  lastTs = ts;

  if (!G.paused) {
    update(dt);
    render(ts);
  }
  rafId = requestAnimationFrame(loop);
}

function update(dt) {
  // power-up timers
  ['speed','double'].forEach(k => {
    if (G.effects[k]) {
      G.effects[k].timer -= dt;
      if (G.effects[k].timer <= 0) {
        delete G.effects[k];
        if (k==='speed') G.speedBoost = false;
        if (k==='double') G.doublePoints = false;
      }
    }
  });

  // special food timers
  G.specialFoods = G.specialFoods.filter(f => { f.timer -= dt; return f.timer > 0; });

  // special spawn
  G.specialSpawnTimer -= dt;
  if (G.specialSpawnTimer <= 0 && G.specialFoods.length < 2) {
    spawnSpecial();
    G.specialSpawnTimer = randomSpecialDelay();
  }

  // update particles
  G.particles = G.particles.filter(p => {
    p.x += p.vx; p.y += p.vy; p.life -= dt; p.vy += 0.04;
    return p.life > 0;
  });

  // move snake
  const interval = G.speedBoost ? G.speed * 0.55 : G.speed;
  if (lastTs - lastMove >= interval) {
    lastMove = lastTs;
    moveSnake();
  }

  renderEffectsUI();
}

function moveSnake() {
  G.dir = G.nextDir;
  const head = G.snake[0];
  let nx = head.x, ny = head.y;
  if (G.dir==='right') nx++;
  if (G.dir==='left')  nx--;
  if (G.dir==='up')    ny--;
  if (G.dir==='down')  ny++;

  // wall collision
  if (nx<0 || nx>=G.cols || ny<0 || ny>=G.cols) { die(); return; }
  // self collision
  for (let i=1; i<G.snake.length-1; i++)
    if (G.snake[i].x===nx && G.snake[i].y===ny) { die(); return; }

  // eat check
  let grow = 0;
  if (G.regularFood && G.regularFood.x===nx && G.regularFood.y===ny) {
    grow = 1;
    let pts = FOOD_TYPES.apple.pts * (G.doublePoints ? 2 : 1);
    addScore(pts);
    spawnParticles(nx, ny, FOOD_TYPES.apple.color, 10);
    sfxEat();
    spawnRegular();
  }
  G.specialFoods.forEach((f,i) => {
    if (f.x===nx && f.y===ny) {
      const ft = FOOD_TYPES[f.type];
      grow += ft.grow;
      let pts = ft.pts * (G.doublePoints ? 2 : 1);
      addScore(pts);
      spawnParticles(nx, ny, ft.color, 16);
      sfxSpecial();
      applyEffect(f.type);
      G.specialFoods.splice(i,1);
    }
  });

  // advance snake
  for (let i=G.snake.length-1; i>0; i--) {
    G.snake[i].px = G.snake[i].x;
    G.snake[i].py = G.snake[i].y;
    G.snake[i].x  = G.snake[i-1].x;
    G.snake[i].y  = G.snake[i-1].y;
  }
  G.snake[0].px = head.x; G.snake[0].py = head.y;
  G.snake[0].x = nx; G.snake[0].y = ny;

  if (grow > 0) {
    for (let g=0; g<grow; g++) {
      const tail = G.snake[G.snake.length-1];
      G.snake.push({x:tail.x, y:tail.y, px:tail.px, py:tail.py});
    }
  } else if (grow < 0) {
    const remove = Math.min(-grow, G.snake.length-3);
    G.snake.splice(G.snake.length-remove, remove);
  }
}

function applyEffect(type) {
  if (type==='bolt') {
    G.speedBoost = true;
    G.effects.speed = { timer:6000, maxTimer:6000 };
  }
  if (type==='diamond') {
    G.doublePoints = true;
    G.effects.double = { timer:10000, maxTimer:10000 };
  }
}

function addScore(pts) {
  G.score += pts;
  updateHUD();
  const newLevel = Math.min(Math.floor(G.score/80)+1, LEVEL_SPEEDS.length);
  if (newLevel > G.level) {
    G.level = newLevel;
    G.speed = LEVEL_SPEEDS[Math.min(G.level-1, LEVEL_SPEEDS.length-1)];
    sfxLevel();
    flashLevel(`SEVİYE ${G.level}`);
    updateHUD();
  }
}

function die() {
  G.running = false;
  G.dead = true;
  sfxDie();
  try { navigator.vibrate && navigator.vibrate([80,40,120]); } catch(e){}
  spawnParticles(G.snake[0].x, G.snake[0].y, '#ff4455', 24);
  setTimeout(showGameOver, 700);
}

// ══════════════════════════════════
//  FOOD SPAWNING
// ══════════════════════════════════
function randomCell(exclude=[]) {
  let tries=0;
  while (tries++<500) {
    const x=Math.floor(Math.random()*G.cols), y=Math.floor(Math.random()*G.cols);
    const onSnake = G.snake.some(s=>s.x===x&&s.y===y);
    const onOther = exclude.some(e=>e.x===x&&e.y===y);
    if (!onSnake && !onOther) return {x,y};
  }
  return {x:0,y:0};
}

function spawnRegular() {
  const excl = G.specialFoods;
  const {x,y} = randomCell(excl);
  G.regularFood = {x,y};
}

function spawnSpecial() {
  const types = ['star','diamond','bolt','pill'];
  const type = types[Math.floor(Math.random()*types.length)];
  const ft = FOOD_TYPES[type];
  const excl = [G.regularFood, ...G.specialFoods].filter(Boolean);
  const {x,y} = randomCell(excl);
  G.specialFoods.push({x,y,type, timer:ft.duration, maxTimer:ft.duration});
}

// ══════════════════════════════════
//  PARTICLES
// ══════════════════════════════════
function spawnParticles(gx,gy,color,count) {
  const px = gx*cellW+cellW*.5, py = gy*cellH+cellH*.5;
  for (let i=0; i<count; i++) {
    const angle = (i/count)*Math.PI*2 + Math.random()*.4;
    const speed = 1.5 + Math.random()*2.5;
    G.particles.push({ x:px, y:py, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed,
      r:2+Math.random()*3, color, life:400+Math.random()*300, maxLife:700 });
  }
}

// ══════════════════════════════════
//  RENDER
// ══════════════════════════════════
function render(ts) {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(bgImg,0,0);

  const t = Math.min(1, (ts-lastMove) / (G.speedBoost ? G.speed*.55 : G.speed));

  drawFood();
  drawSpecialFoods(ts);
  drawSnake(t);
  drawParticles();
}

function drawFood() {
  if (!G.regularFood) return;
  const f = G.regularFood;
  const x = f.x*cellW+cellW*.5, y = f.y*cellH+cellH*.5;
  const r = cellW*.38;

  ctx.save();
  ctx.shadowColor = FOOD_TYPES.apple.color;
  ctx.shadowBlur = 14;
  ctx.fillStyle = FOOD_TYPES.apple.color;
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fill();
  // shine
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.beginPath();
  ctx.arc(x-r*.25, y-r*.25, r*.35, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawSpecialFoods(ts) {
  G.specialFoods.forEach(f => {
    const ft = FOOD_TYPES[f.type];
    const x = f.x*cellW+cellW*.5, y = f.y*cellH+cellH*.5;
    const pct = f.timer/f.maxTimer;
    const r = cellW*.38;

    // pulse when low time
    const scale = pct < 0.25 ? 1 + .15*Math.sin(ts*0.012) : 1;
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);

    // glow ring
    ctx.shadowColor = ft.color;
    ctx.shadowBlur = 18;
    ctx.strokeStyle = ft.color + (pct<.25?'ff':'88');
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0,0,r+4,0,Math.PI*2);
    ctx.stroke();

    // fill
    ctx.shadowBlur = 10;
    ctx.fillStyle = ft.color + '33';
    ctx.beginPath();
    ctx.arc(0,0,r,0,Math.PI*2);
    ctx.fill();

    // emoji
    ctx.shadowBlur = 0;
    ctx.font = `${cellW*.7}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.fillText(ft.emoji, 0, 1);

    // timer arc
    ctx.strokeStyle = ft.color;
    ctx.lineWidth = 3;
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(0,0,r+6,-Math.PI*.5,-Math.PI*.5+Math.PI*2*pct);
    ctx.stroke();

    ctx.restore();
  });
}

function drawSnake(t) {
  if (G.snake.length < 1) return;
  const s = G.snake;

  // interpolated visual positions
  const pts = s.map(seg => ({
    x: lerp(seg.px, seg.x, t)*cellW + cellW*.5,
    y: lerp(seg.py, seg.y, t)*cellH + cellH*.5,
  }));

  const baseColor = G.speedBoost ? '#ffaa00' : G.doublePoints ? '#00ccff' : '#00ee77';
  const glowColor = G.speedBoost ? '#ffcc44' : G.doublePoints ? '#44ddff' : '#00ff88';

  // tail (darker, thinner) drawn first
  if (pts.length > 1) {
    ctx.save();
    ctx.strokeStyle = baseColor + '55';
    ctx.lineWidth = cellW * .52;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i=1; i<pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
    ctx.restore();
  }

  // main body
  ctx.save();
  ctx.strokeStyle = baseColor;
  ctx.lineWidth = cellW * .62;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.shadowColor = glowColor;
  ctx.shadowBlur = 14;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i=1; i<pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.stroke();
  ctx.restore();

  // head highlight
  ctx.save();
  ctx.fillStyle = glowColor;
  ctx.shadowColor = glowColor;
  ctx.shadowBlur = 22;
  ctx.beginPath();
  ctx.arc(pts[0].x, pts[0].y, cellW*.34, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // eyes
  drawEyes(pts[0].x, pts[0].y);
}

function drawEyes(hx,hy) {
  const o = cellW*.2, r = cellW*.1;
  let e1x,e1y,e2x,e2y;
  const d = G.dir;
  if (d==='right'){ e1x=hx+o; e1y=hy-o; e2x=hx+o; e2y=hy+o; }
  else if(d==='left'){ e1x=hx-o; e1y=hy-o; e2x=hx-o; e2y=hy+o; }
  else if(d==='up'){ e1x=hx-o; e1y=hy-o; e2x=hx+o; e2y=hy-o; }
  else { e1x=hx-o; e1y=hy+o; e2x=hx+o; e2y=hy+o; }

  ctx.fillStyle = '#001a0a';
  ctx.beginPath(); ctx.arc(e1x,e1y,r,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(e2x,e2y,r,0,Math.PI*2); ctx.fill();
  // gleam
  ctx.fillStyle = 'rgba(255,255,255,.7)';
  ctx.beginPath(); ctx.arc(e1x+r*.3,e1y-r*.3,r*.4,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(e2x+r*.3,e2y-r*.3,r*.4,0,Math.PI*2); ctx.fill();
}

function drawParticles() {
  G.particles.forEach(p => {
    const alpha = Math.max(0, p.life/p.maxLife);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * alpha, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });
}

// ══════════════════════════════════
//  EFFECTS HUD
// ══════════════════════════════════
function renderEffectsUI() {
  const el = document.getElementById('effects');
  el.innerHTML = '';
  if (G.effects.speed) {
    const pct = G.effects.speed.timer/G.effects.speed.maxTimer*100;
    el.innerHTML += `<div class="effect-chip" style="color:#ffaa00">⚡ Hız
      <div class="ef-bar"><div class="ef-fill" style="width:${pct}%;background:#ffaa00"></div></div></div>`;
  }
  if (G.effects.double) {
    const pct = G.effects.double.timer/G.effects.double.maxTimer*100;
    el.innerHTML += `<div class="effect-chip" style="color:#00ccff">💎 2x Puan
      <div class="ef-bar"><div class="ef-fill" style="width:${pct}%;background:#00ccff"></div></div></div>`;
  }
}

// ══════════════════════════════════
//  HUD / SCREENS
// ══════════════════════════════════
function updateHUD() {
  document.getElementById('hudScore').textContent = G.score;
  document.getElementById('hudLevel').textContent = G.level;
  document.getElementById('hudBest').textContent  = bestScore;
}

function flashLevel(text) {
  const fl = document.getElementById('lvlFlash');
  const tx = document.getElementById('lvlText');
  tx.textContent = text;
  tx.style.color = G.speedBoost ? '#ffaa00' : '#00ff88';
  fl.classList.remove('show');
  void fl.offsetWidth;
  fl.classList.add('show');
}

function showGameOver() {
  cancelAnimationFrame(rafId);
  const isNew = G.score > bestScore;
  if (isNew) { bestScore = G.score; localStorage.setItem('snake_best', bestScore); }
  document.getElementById('goScore').textContent = G.score;
  document.getElementById('goBest').textContent  = bestScore;
  document.getElementById('goLevel').textContent = G.level;
  document.getElementById('goLen').textContent   = G.snake.length;
  document.getElementById('newBest').classList.toggle('hidden', !isNew);
  document.getElementById('retryBtn').onclick = () => {
    document.getElementById('gameOverScreen').classList.add('hidden');
    startGame(G.baseSpeed);
  };
  document.getElementById('bestStart').textContent = bestScore;
  document.getElementById('gameOverScreen').classList.remove('hidden');
}

function togglePause() {
  if (!G.running && !G.paused) return;
  G.paused = !G.paused;
  if (G.paused) {
    cancelAnimationFrame(rafId);
    document.getElementById('pauseScoreVal').textContent = G.score;
    document.getElementById('pauseScreen').classList.remove('hidden');
  } else {
    resumeGame();
  }
}
function resumeGame() {
  document.getElementById('pauseScreen').classList.add('hidden');
  G.paused = false;
  lastTs = performance.now();
  rafId = requestAnimationFrame(loop);
}
function goHome() {
  G.running = false;
  cancelAnimationFrame(rafId);
  document.getElementById('pauseScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.add('hidden');
  document.getElementById('gameLayout').style.display = 'none';
  document.getElementById('startScreen').classList.remove('hidden');
  document.getElementById('bestStart').textContent = bestScore;
}

// ══════════════════════════════════
//  INPUT — JOYSTICK
// ══════════════════════════════════
const jBase  = document.getElementById('jBase');
const jThumb = document.getElementById('jThumb');
const jMaxR  = 44;
let jTouchId = -1, jActive = false;

function jDir(dx,dy) {
  if (Math.sqrt(dx*dx+dy*dy) < 14) return null;
  return Math.abs(dx)>Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'down':'up');
}

function setDir(d) {
  if (!d || !G.running || G.paused) return;
  const opp = {right:'left',left:'right',up:'down',down:'up'};
  if (d !== opp[G.dir]) G.nextDir = d;
}

document.addEventListener('touchstart', e => {
  const rect = jBase.getBoundingClientRect();
  const cx = rect.left+rect.width*.5, cy = rect.top+rect.height*.5;
  for (const t of e.touches) {
    const dx = t.clientX-cx, dy = t.clientY-cy;
    if (Math.sqrt(dx*dx+dy*dy) < rect.width*.8) {
      jActive = true; jTouchId = t.identifier;
      jThumb.style.transition = 'none';
    }
  }
}, {passive:true});

document.addEventListener('touchmove', e => {
  if (!jActive) return;
  for (const t of e.changedTouches) {
    if (t.identifier !== jTouchId) continue;
    const rect = jBase.getBoundingClientRect();
    const cx = rect.left+rect.width*.5, cy = rect.top+rect.height*.5;
    const dx = t.clientX-cx, dy = t.clientY-cy;
    const dist = Math.sqrt(dx*dx+dy*dy);
    const clamp = Math.min(1, jMaxR/dist);
    jThumb.style.transform = `translate(calc(-50% + ${dx*clamp}px), calc(-50% + ${dy*clamp}px))`;
    const d = jDir(dx,dy);
    if (d) setDir(d);
  }
}, {passive:true});

document.addEventListener('touchend', e => {
  for (const t of e.changedTouches) {
    if (t.identifier === jTouchId) {
      jActive = false; jTouchId = -1;
      jThumb.style.transition = 'transform .15s';
      jThumb.style.transform = 'translate(-50%,-50%)';
    }
  }
}, {passive:true});

// swipe on canvas
let swipeX, swipeY;
document.getElementById('canvasWrap').addEventListener('touchstart', e => {
  swipeX = e.touches[0].clientX; swipeY = e.touches[0].clientY;
}, {passive:true});
document.getElementById('canvasWrap').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - swipeX;
  const dy = e.changedTouches[0].clientY - swipeY;
  if (Math.sqrt(dx*dx+dy*dy) < 25) return;
  setDir(Math.abs(dx)>Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'down':'up'));
}, {passive:true});

// keyboard
document.addEventListener('keydown', e => {
  const map = {ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
  if (map[e.key]) { e.preventDefault(); setDir(map[e.key]); }
  if (e.key==='Escape'||e.key==='p') togglePause();
});

// ══════════════════════════════════
//  UTILS
// ══════════════════════════════════
const lerp = (a,b,t) => a+(b-a)*t;

// Init best score display
document.getElementById('bestStart').textContent = bestScore;
</script>
